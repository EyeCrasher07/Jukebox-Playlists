plugins { id 'java'; id 'net.minecraftforge.gradle' version '7.0.17' }

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
minecraft {
mappings channel: 'official', version: '1.21.1'
runs {
    configureEach { mods { jukebox_playlists { source sourceSets.main } }; args '--mixin.config=jukebox-playlists.mixins.json' }
    register('server') { workingDir = layout.buildDirectory.dir('run/server'); args '--nogui' }
} }
repositories { minecraft.mavenizer(it); maven fg.forgeMaven; maven fg.minecraftLibsMaven; mavenCentral() }
dependencies { implementation minecraft.dependency('net.minecraftforge:forge:1.21.1-52.1.20') }

version = '1.0.1'
group = 'dev.eyecrasher.jukeboxplaylists'
base { archivesName = 'jukebox-playlists-forge-1.21.1' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
configurations.matching {
    it.name.endsWith('CompileClasspath') || it.name.endsWith('RuntimeClasspath') ||
        it.name in ['compileClasspath', 'runtimeClasspath']
}.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
}
jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes 'MixinConfigs': 'jukebox-playlists.mixins.json' }
    from(file('LICENSE')) { rename { 'LICENSE_jukebox-playlists.txt' } }
}
