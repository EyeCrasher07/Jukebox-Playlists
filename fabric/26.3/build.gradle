plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }

java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
repositories { mavenCentral() }
dependencies {
minecraft 'com.mojang:minecraft:26.3'
implementation 'net.fabricmc:fabric-loader:0.19.5'
}
dependencies { implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3' }
loom.runs { server { runDir 'build/run/server'; programArg 'nogui' } }

version = '1.0.1'
group = 'dev.eyecrasher.jukeboxplaylists'
base { archivesName = 'jukebox-playlists-fabric-26.3' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
configurations.matching {
    it.name.endsWith('CompileClasspath') || it.name.endsWith('RuntimeClasspath') ||
        it.name in ['compileClasspath', 'runtimeClasspath']
}.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
}
jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes 'MixinConfigs': 'jukebox-playlists.mixins.json' }
    from(file('LICENSE')) { rename { 'LICENSE_jukebox-playlists.txt' } }
}
