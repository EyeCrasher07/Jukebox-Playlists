plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }
ext.playlistRoot = file('../..').absolutePath
ext.playlistTarget = new groovy.json.JsonSlurper().parseText('{"id": "fabric-26.3", "minecraft": "26.3", "loader": "fabric", "loader_version": "0.19.5", "java": 25, "fabric_api": "0.162.0+26.3"}')

java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
repositories { mavenCentral() }
dependencies {
minecraft 'com.mojang:minecraft:26.3'
implementation 'net.fabricmc:fabric-loader:0.19.5'
}
dependencies { implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3' }
loom.runs { server { runDir 'build/run/server'; programArg 'nogui' } }

apply from: new File(playlistRoot, 'gradle/release.gradle')
