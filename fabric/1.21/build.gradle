plugins { id 'fabric-loom' version '1.13.6' }
ext.playlistRoot = file('../..').absolutePath
ext.playlistTarget = new groovy.json.JsonSlurper().parseText('{"id": "fabric-1.21", "minecraft": "1.21", "loader": "fabric", "loader_version": "0.19.5", "java": 21, "fabric_api": "0.102.0+1.21"}')

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
repositories { mavenCentral() }
dependencies {
minecraft 'com.mojang:minecraft:1.21'
mappings loom.officialMojangMappings()
modImplementation 'net.fabricmc:fabric-loader:0.19.5'
}
dependencies { modImplementation 'net.fabricmc.fabric-api:fabric-api:0.102.0+1.21' }
loom.runs { server { runDir 'build/run/server'; programArg 'nogui' } }

apply from: new File(playlistRoot, 'gradle/release.gradle')
