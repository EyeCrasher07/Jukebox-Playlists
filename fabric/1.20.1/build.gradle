plugins { id 'fabric-loom' version '1.13.6' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
repositories { mavenCentral() }
dependencies {
minecraft 'com.mojang:minecraft:1.20.1'
mappings loom.officialMojangMappings()
modImplementation 'net.fabricmc:fabric-loader:0.19.5'
}
dependencies { modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.12+1.20.1' }
loom.runs { server { runDir 'build/run/server'; programArg 'nogui' } }

version = '1.0.1'
group = 'dev.eyecrasher.jukeboxplaylists'
base { archivesName = 'jukebox-playlists-fabric-1.20.1' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
configurations.matching {
    it.name.endsWith('CompileClasspath') || it.name.endsWith('RuntimeClasspath') ||
        it.name in ['compileClasspath', 'runtimeClasspath']
}.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
}
jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes 'MixinConfigs': 'jukebox-playlists.mixins.json' }
    from(file('LICENSE')) { rename { 'LICENSE_jukebox-playlists.txt' } }
}
