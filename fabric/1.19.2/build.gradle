plugins { id 'fabric-loom' version '1.13.6' }
ext.playlistRoot = file('../..').absolutePath
ext.playlistTarget = new groovy.json.JsonSlurper().parseText('{"id": "fabric-1.19.2", "minecraft": "1.19.2", "loader": "fabric", "loader_version": "0.19.5", "java": 17, "fabric_api": "0.77.0+1.19.2"}')

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
repositories { mavenCentral() }
dependencies {
minecraft 'com.mojang:minecraft:1.19.2'
mappings loom.officialMojangMappings()
modImplementation 'net.fabricmc:fabric-loader:0.19.5'
}
dependencies { modImplementation 'net.fabricmc.fabric-api:fabric-api:0.77.0+1.19.2' }
loom.runs { server { runDir 'build/run/server'; programArg 'nogui' } }

apply from: new File(playlistRoot, 'gradle/release.gradle')
