plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
ext.playlistRoot = file('../..').absolutePath
ext.playlistTarget = new groovy.json.JsonSlurper().parseText('{"id": "neoforge-1.20.4", "minecraft": "1.20.4", "loader": "neoforge", "loader_version": "20.4.253", "java": 17}')

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
neoForge { version = '20.4.253'
mods { jukebox_playlists { sourceSet(sourceSets.main) } }
    runs { server { server(); gameDirectory = file('build/run/server'); programArgument '--nogui' } }
}
repositories { mavenCentral() }

apply from: new File(playlistRoot, 'gradle/release.gradle')
