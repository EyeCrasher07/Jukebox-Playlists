plugins { id 'java-library'; id 'net.neoforged.gradle.userdev' version '7.1.39' }

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
dependencies { implementation 'net.neoforged:neoforge:20.5.21-beta' }
repositories { mavenCentral() }
runs {
    configureEach { workingDirectory file('build/run/server'); modSources { add('jukebox_playlists', sourceSets.main) } }
    server { argument '--nogui' }
}
tasks.withType(net.neoforged.gradle.common.runtime.tasks.JavaSourceTransformer).configureEach {
    javaLauncher.set(javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) })
}

version = '1.0.1'
group = 'dev.eyecrasher.jukeboxplaylists'
base { archivesName = 'jukebox-playlists-neoforge-1.20.5' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
configurations.matching {
    it.name.endsWith('CompileClasspath') || it.name.endsWith('RuntimeClasspath') ||
        it.name in ['compileClasspath', 'runtimeClasspath']
}.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
}
jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes 'MixinConfigs': 'jukebox-playlists.mixins.json' }
    from(file('LICENSE')) { rename { 'LICENSE_jukebox-playlists.txt' } }
}
