plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
neoForge { version = '21.2.1-beta'
mods { jukebox_playlists { sourceSet(sourceSets.main) } }
    runs { server { server(); gameDirectory = file('build/run/server'); programArgument '--nogui' } }
}
repositories { mavenCentral() }

version = '1.0.1'
group = 'dev.eyecrasher.jukeboxplaylists'
base { archivesName = 'jukebox-playlists-neoforge-1.21.2' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
configurations.matching {
    it.name.endsWith('CompileClasspath') || it.name.endsWith('RuntimeClasspath') ||
        it.name in ['compileClasspath', 'runtimeClasspath']
}.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
}
jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes 'MixinConfigs': 'jukebox-playlists.mixins.json' }
    from(file('LICENSE')) { rename { 'LICENSE_jukebox-playlists.txt' } }
}
