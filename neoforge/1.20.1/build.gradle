plugins { id 'java-library'; id 'net.neoforged.moddev.legacyforge' version '2.0.148' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
legacyForge { enable { neoForgeVersion = '1.20.1-47.1.106'; disableRecompilation = true }
mods { jukebox_playlists { sourceSet(sourceSets.main) } }
    runs { server { server(); gameDirectory = file('build/run/server'); programArgument '--nogui' } }
}
repositories { mavenCentral() }
dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }
mixin { add sourceSets.main, 'main.refmap.json'; config 'jukebox-playlists.mixins.json' }

version = '1.0.1'
group = 'dev.eyecrasher.jukeboxplaylists'
base { archivesName = 'jukebox-playlists-neoforge-1.20.1' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
configurations.matching {
    it.name.endsWith('CompileClasspath') || it.name.endsWith('RuntimeClasspath') ||
        it.name in ['compileClasspath', 'runtimeClasspath']
}.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
}
jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes 'MixinConfigs': 'jukebox-playlists.mixins.json' }
    from(file('LICENSE')) { rename { 'LICENSE_jukebox-playlists.txt' } }
}
