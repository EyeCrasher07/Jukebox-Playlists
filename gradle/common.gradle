version = new groovy.json.JsonSlurper().parse(new File(playlistRoot, 'versions.json')).mod_version
group = 'dev.eyecrasher.jukeboxplaylists'
base { archivesName = 'jukebox-playlists-' + playlistTarget.loader + '-' + playlistTarget.minecraft }
def repositoryRoot = file(playlistRoot)
def generated = layout.buildDirectory.dir('generated/playlist')
tasks.register('preparePlaylist', Exec) {
    inputs.dir(new File(repositoryRoot, 'tools/templates'))
    inputs.file(new File(repositoryRoot, 'tools/generate.py'))
    inputs.file(new File(repositoryRoot, 'versions.json'))
    inputs.file(new File(repositoryRoot, 'pack-versions.json'))
    inputs.property('target', playlistTarget.id)
    outputs.dir(generated)
    commandLine 'python3', new File(repositoryRoot, 'tools/generate.py'), '--target', playlistTarget.id, '--output', generated.get().asFile
}
sourceSets.main {
    java.setSrcDirs([generated.map { it.dir('java') }])
    resources.setSrcDirs([generated.map { it.dir('resources') }])
}
compileJava.dependsOn preparePlaylist
processResources.dependsOn preparePlaylist
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = playlistTarget.java == 25 ? 21 : playlistTarget.java
}
configurations.matching { it.name.endsWith('CompileClasspath') || it.name.endsWith('RuntimeClasspath') || it.name in ['compileClasspath', 'runtimeClasspath'] }.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, playlistTarget.java)
}
jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes 'MixinConfigs': 'jukebox-playlists.mixins.json' }
}
if (providers.gradleProperty('playlistTest').isPresent()) {
    if (playlistTarget.loader == 'forge') {
        if (playlistTarget.minecraft in ['1.20.6', '1.21']) {
            // These ModLauncher releases require jopt-simple 5's module name.
            configurations.configureEach { resolutionStrategy.force 'net.sf.jopt-simple:jopt-simple:5.0.4' }
        }
        // Forge's userdev scanner needs classes and metadata in one root.
        sourceSets.main.output.resourcesDir = layout.buildDirectory.dir('classes/java/main').get().asFile
        tasks.named('processResources') {
            dependsOn tasks.named('compileJava')
            destinationDir = sourceSets.main.output.resourcesDir
        }
        if (playlistTarget.minecraft in ['1.17.1', '1.18', '1.18.1', '1.18.2']) {
            // SlimeLauncher's public lookup needs BootstrapLauncher's exported
            // entry point. This affects only the development test launcher.
            def testBootstrap = configurations.create('playlistTestBootstrap') { transitive = false }
            dependencies.add(testBootstrap.name, 'cpw.mods:bootstraplauncher:1.1.2')
            afterEvaluate {
                tasks.named('runServer') {
                    def modules = project.files(new ArrayList(patcherModules.from))
                    patcherModules.setFrom(modules.filter { !it.name.startsWith('bootstraplauncher-') }, testBootstrap)
                }
            }
        }
        if (playlistTarget.minecraft == '1.20.2') {
            // Forge 48 still discovers development mod folders through this
            // environment variable; its userdev run metadata omits it.
            tasks.withType(JavaExec).matching { it.name == 'runServer' }.configureEach {
                doFirst {
                    environment 'MOD_CLASSES', sourceSets.main.output.files.collect {
                        'jukebox_playlists%%' + it.absolutePath
                    }.join(File.pathSeparator)
                }
            }
        }
    }
    tasks.named('preparePlaylist') {
        commandLine 'python3', new File(repositoryRoot, 'tools/generate.py'), '--target', playlistTarget.id, '--output', generated.get().asFile, '--tests'
        inputs.property('tests', true)
    }
}
